services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recruitai
      POSTGRES_USER: recruitai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project-root .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitai -d recruitai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recruitai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project-root .env}@db:5432/recruitai
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:8443
    ports:
      - "8000:8000"
    volumes:
      - recruitai_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  recruitai_uploads:
